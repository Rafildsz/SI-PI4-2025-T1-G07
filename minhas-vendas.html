<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minhas Vendas — Semear</title>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal (mesmo do catálogo) -->
  <link rel="stylesheet" href="css/catalogo.css">
  
  <style>
    .tab-btn {
      background: none;
      border: none;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #3aa55a;
      background: #f5f5f5;
    }
    .tab-btn.active {
      color: #3aa55a;
      border-bottom-color: #3aa55a;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="container dash-header" role="banner">
    <a class="brand-inline" href="index.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Layout principal -->
  <div class="container layout">
    <main role="main">
      <h2 style="margin-bottom: 24px;">Vendas e Pedidos</h2>
      
      <!-- Tabs de Filtro -->
      <div style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0;">
        <button class="tab-btn active" data-status="todos" onclick="filtrarPorStatus('todos')">
          Todos
        </button>
        <button class="tab-btn" data-status="pendentes" onclick="filtrarPorStatus('pendentes')">
          Pendentes
        </button>
        <button class="tab-btn" data-status="andamento" onclick="filtrarPorStatus('andamento')">
          Em Andamento
        </button>
        <button class="tab-btn" data-status="enviados" onclick="filtrarPorStatus('enviados')">
          Enviados
        </button>
        <button class="tab-btn" data-status="finalizados" onclick="filtrarPorStatus('finalizados')">
          Finalizados
        </button>
        <button class="tab-btn" data-status="cancelados" onclick="filtrarPorStatus('cancelados')">
          Cancelados
        </button>
      </div>

      <div class="searchbar" style="margin-bottom: 26px;">
        <input type="text" id="searchPedidos" placeholder="Buscar pedidos..." />
      </div>

      <div id="pedidosGrid" class="grid" style="grid-template-columns: 1fr;">
        <!-- Pedidos serão carregados aqui -->
      </div>
    </main>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Conteúdo carregado por menu-produtor.js -->
    </aside>
  </div>

  <!-- Modal de Detalhes do Pedido -->
  <div id="modalDetalhes" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 32px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0;">Detalhes do Pedido</h2>
        <button onclick="fecharModalDetalhes()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0; width: 32px; height: 32px;">&times;</button>
      </div>
      <div id="detalhesContent"></div>
      <button onclick="fecharModalDetalhes()" class="btn btn-primary" style="width: 100%; margin-top: 24px; padding: 12px;">Fechar</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear — Produtos frescos direto do produtor.</p>
    </div>
  </footer>

  <script>
    // Atualiza o ano do rodapé
    document.getElementById('year').textContent = new Date().getFullYear();

    // Toggle da sidebar
    const KEY = 'semear_sidebar_hidden';
    const hamb = document.getElementById('hamb');
    if (localStorage.getItem(KEY) === '1'){
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded','false');
    }
    hamb.onclick = () => {
      const h = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', !h);
      localStorage.setItem(KEY, h ? '1':'0');
    };

    function fmtPreco(v){
      return v.toLocaleString('pt-BR',{ style:'currency', currency:'BRL' });
    }

    function fmtData(dataStr) {
      if (!dataStr) return '';
      const data = new Date(dataStr);
      return data.toLocaleDateString('pt-BR', { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    let todosPedidosCache = [];
    let statusAtual = 'todos';

    // Carrega pedidos recebidos pelo produtor
    async function carregarPedidos() {
      const usuarioId = localStorage.getItem('usuario_id');
      if (!usuarioId) {
        window.location.href = 'login-produtor.html';
        return;
      }

      try {
        const response = await fetch('http://localhost:8081/api/pedidos');
        if (!response.ok) throw new Error('Erro ao buscar pedidos');
        
        const todosPedidos = await response.json();
        
        // Filtra pedidos onde o produtor é o usuário logado
        todosPedidosCache = todosPedidos.filter(p => {
          return p.produtor?.id_usuario == usuarioId;
        });
        
        aplicarFiltro();
      } catch (error) {
        console.error('Erro ao carregar pedidos:', error);
        document.getElementById('pedidosGrid').innerHTML = '<p style="text-align: center; padding: 40px;">Erro ao carregar pedidos.</p>';
      }
    }

    function filtrarPorStatus(status) {
      statusAtual = status;
      
      // Atualiza botões ativos
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-status="${status}"]`).classList.add('active');
      
      aplicarFiltro();
    }

    function aplicarFiltro() {
      let pedidosFiltrados = [...todosPedidosCache];
      
      // Filtra por status
      if (statusAtual === 'pendentes') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'PENDENTE');
      } else if (statusAtual === 'andamento') {
        pedidosFiltrados = pedidosFiltrados.filter(p => 
          p.status === 'CONFIRMADO' || p.status === 'EM_PREPARO'
        );
      } else if (statusAtual === 'enviados') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'ENVIADO');
      } else if (statusAtual === 'finalizados') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'ENTREGUE');
      } else if (statusAtual === 'cancelados') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'CANCELADO');
      }
      
      renderizarPedidos(pedidosFiltrados);
    }

    function renderizarPedidos(pedidos) {
      const grid = document.getElementById('pedidosGrid');
      
      if (pedidos.length === 0) {
        grid.innerHTML = '<p style="text-align: center; padding: 40px;">Nenhum pedido recebido ainda.</p>';
        return;
      }

      grid.innerHTML = pedidos.map(pedido => {
        const statusClass = {
          'PENDENTE': 'warning',
          'CONFIRMADO': 'info',
          'EM_PREPARO': 'info',
          'ENVIADO': 'primary',
          'ENTREGUE': 'success',
          'CANCELADO': 'danger'
        }[pedido.status] || 'secondary';

        return `
          <div class="card">
            <div class="card-body">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px;">
                <div>
                  <h3>Pedido #${pedido.id_pedido}</h3>
                  <p class="meta">${fmtData(pedido.data_pedido)}</p>
                </div>
                <span class="chip" style="background: ${statusClass === 'success' ? '#28a745' : statusClass === 'danger' ? '#dc3545' : statusClass === 'warning' ? '#ffc107' : '#17a2b8'}; color: white; padding: 4px 12px; border-radius: 12px;">
                  ${pedido.status}
                </span>
              </div>

              <div style="margin: 12px 0;">
                <strong>Restaurante:</strong> ${pedido.restaurante?.nome || 'N/A'}
              </div>

              <div style="margin: 12px 0;">
                <strong>Total:</strong> <span style="font-size: 18px; color: #28a745; font-weight: 700;">${fmtPreco(pedido.valor_total)}</span>
              </div>

              ${pedido.observacoes ? `<p style="color: #666; margin: 8px 0;"><strong>Observações:</strong> ${pedido.observacoes}</p>` : ''}

              <div class="toolbar-right" style="margin-top: 16px; gap: 8px;">
                <button class="btn btn-primary" onclick="verDetalhesPedido(${pedido.id_pedido})">Ver Detalhes</button>
                ${pedido.status === 'PENDENTE' ? `
                  <button class="btn" style="background: #28a745; color: white;" onclick="confirmarPedido(${pedido.id_pedido})">Confirmar</button>
                  <button class="btn" style="background: #dc3545; color: white;" onclick="recusarPedido(${pedido.id_pedido})">Recusar</button>
                ` : ''}
                ${pedido.status === 'CONFIRMADO' ? `
                  <button class="btn" style="background: #17a2b8; color: white;" onclick="marcarEnviado(${pedido.id_pedido})">Marcar como Enviado</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function verDetalhesPedido(pedidoId) {
      try {
        const response = await fetch(`http://localhost:8081/api/pedidos/${pedidoId}`);
        if (!response.ok) throw new Error('Erro ao buscar detalhes do pedido');
        
        const pedido = await response.json();
        mostrarModalDetalhes(pedido);
      } catch (error) {
        console.error('Erro ao carregar detalhes:', error);
        alert('Erro ao carregar detalhes do pedido');
      }
    }

    function mostrarModalDetalhes(pedido) {
      const content = document.getElementById('detalhesContent');
      
      const statusColors = {
        'PENDENTE': '#ffc107',
        'CONFIRMADO': '#17a2b8',
        'EM_PREPARO': '#17a2b8',
        'ENVIADO': '#17a2b8',
        'ENTREGUE': '#28a745',
        'CANCELADO': '#dc3545'
      };

      let html = `
        <div style="background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong style="font-size: 18px;">Pedido #${pedido.id_pedido}</strong>
            <span style="background: ${statusColors[pedido.status] || '#6c757d'}; color: white; padding: 4px 12px; border-radius: 12px; font-size: 14px;">
              ${pedido.status}
            </span>
          </div>
          <p style="margin: 4px 0; color: #666;">Data: ${fmtData(pedido.data_pedido)}</p>
          <p style="margin: 4px 0;"><strong>Restaurante:</strong> ${pedido.restaurante?.nome || 'N/A'}</p>
        </div>

        <h3 style="margin: 20px 0 12px; font-size: 16px;">Itens do Pedido</h3>
        <div style="border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;">
      `;

      if (pedido.itens && pedido.itens.length > 0) {
        pedido.itens.forEach((item, index) => {
          const subtotal = item.quantidade * item.preco_unitario;
          html += `
            <div style="padding: 12px; border-bottom: ${index < pedido.itens.length - 1 ? '1px solid #e0e0e0' : 'none'};">
              <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <strong>${item.nome_produto || 'Produto'}</strong>
                <strong>${fmtPreco(subtotal)}</strong>
              </div>
              <div style="color: #666; font-size: 14px;">
                ${item.quantidade} x ${fmtPreco(item.preco_unitario)}
              </div>
            </div>
          `;
        });
      } else {
        html += '<div style="padding: 12px; text-align: center; color: #999;">Nenhum item encontrado</div>';
      }

      html += `
        </div>

        <div style="background: #f8f9fa; padding: 16px; border-radius: 8px; margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size: 18px;">Total do Pedido</strong>
            <strong style="font-size: 24px; color: #28a745;">${fmtPreco(pedido.valor_total)}</strong>
          </div>
        </div>
      `;

      if (pedido.observacoes) {
        html += `
          <div style="margin-top: 20px; padding: 12px; background: #fff3cd; border-radius: 8px; border-left: 4px solid #ffc107;">
            <strong>Observações:</strong><br>
            <span style="color: #666;">${pedido.observacoes}</span>
          </div>
        `;
      }

      content.innerHTML = html;
      document.getElementById('modalDetalhes').style.display = 'flex';
    }

    function fecharModalDetalhes() {
      document.getElementById('modalDetalhes').style.display = 'none';
    }

    async function confirmarPedido(pedidoId) {
      if (!confirm('Confirmar este pedido?')) return;
      await atualizarStatusPedido(pedidoId, 'CONFIRMADO');
    }

    async function recusarPedido(pedidoId) {
      if (!confirm('Recusar este pedido?')) return;
      await atualizarStatusPedido(pedidoId, 'CANCELADO');
    }

    async function marcarEnviado(pedidoId) {
      if (!confirm('Marcar pedido como enviado?')) return;
      await atualizarStatusPedido(pedidoId, 'ENVIADO');
    }

    async function atualizarStatusPedido(pedidoId, novoStatus) {
      try {
        const response = await fetch(`http://localhost:8081/api/pedidos/${pedidoId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: novoStatus })
        });

        if (response.ok) {
          alert('Status atualizado com sucesso!');
          carregarPedidos();
        } else {
          alert('Erro ao atualizar status');
        }
      } catch (error) {
        console.error('Erro ao atualizar status:', error);
        alert('Erro ao atualizar status');
      }
    }

    // Busca de pedidos
    document.getElementById('searchPedidos').addEventListener('input', (e) => {
      const termo = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('#pedidosGrid .card');
      
      cards.forEach(card => {
        const texto = card.textContent.toLowerCase();
        card.style.display = texto.includes(termo) ? 'block' : 'none';
      });
    });

    // Carrega pedidos ao iniciar
    carregarPedidos();
  </script>
  <script src="js/menu-produtor.js"></script>
</body>
</html>
