<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrinho — Semear</title>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
  <!-- Header -->
  <header class="container dash-header" role="banner">
    <a class="brand-inline" href="index.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <h1 class="page-title">Meu Carrinho</h1>

    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Layout principal -->
  <main class="container layout" role="main">
    <section>
      <div style="margin-bottom: 24px;">
        <a href="catalogo.html" class="btn" style="text-decoration: none;">← Voltar ao Catálogo</a>
      </div>

      <div id="carrinhoVazio" style="display: none; text-align: center; padding: 60px 20px;">
        <h2>Seu carrinho está vazio</h2>
        <p style="color: #666; margin: 16px 0;">Adicione produtos do catálogo para fazer seu pedido.</p>
        <a href="catalogo.html" class="btn btn-primary" style="text-decoration: none; display: inline-block; margin-top: 16px;">
          Ir para o Catálogo
        </a>
      </div>

      <div id="carrinhoConteudo" style="display: none;">
        <!-- Itens do carrinho -->
        <div id="itensCarrinho" class="grid" style="grid-template-columns: 1fr; gap: 16px;"></div>

        <!-- Resumo do pedido -->
        <div class="card" style="margin-top: 32px; background: #f8f9fa;">
          <div class="card-body">
            <h3>Resumo do Pedido</h3>
            <div style="display: flex; justify-content: space-between; margin: 16px 0; font-size: 16px;">
              <span>Subtotal:</span>
              <span id="subtotal" style="font-weight: 600;">R$ 0,00</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin: 16px 0; font-size: 18px; font-weight: 700; padding-top: 16px; border-top: 2px solid #ddd;">
              <span>Total:</span>
              <span id="total" style="color: #28a745;">R$ 0,00</span>
            </div>

            <button id="btnFinalizar" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 16px; margin-top: 16px;">
              Finalizar Pedido
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-avatar">U</div>
        <div>
          <div class="sb-title">Usuário</div>
          <small>Restaurante</small>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item" href="catalogo.html">🏠 Catálogo</a>
        <a class="sb-item" href="meus-pedidos.html">🧾 Meus Pedidos</a>
        <a class="sb-item" href="mensagem.html">✉️ Mensagens</a>
        <div class="sb-sep"></div>
        <a class="sb-item sb-logout" href="index.html">↩️ Sair</a>
      </nav>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear</p>
    </div>
  </footer>

  <!-- Toggle sidebar -->
  <script>
    const hamb = document.getElementById('hamb');
    const KEY = 'semear_sidebar_hidden';
    if (localStorage.getItem(KEY) === '1'){
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded','false');
    }
    hamb.onclick = () => {
      const h = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', !h);
      localStorage.setItem(KEY, h ? '1':'0');
    };
    
    document.getElementById('year').textContent = new Date().getFullYear();

    // Logout - limpar localStorage
    document.querySelector('.sb-logout').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('usuario_id');
      localStorage.removeItem('usuario_logado');
      localStorage.removeItem('semear_carrinho');
      window.location.href = 'index.html';
    });
  </script>

  <!-- JS do carrinho -->
  <script>
    const API_BASE = "http://localhost:8081/api";

    // Obtém o carrinho do localStorage
    function obterCarrinho() {
      const carrinho = localStorage.getItem('semear_carrinho');
      return carrinho ? JSON.parse(carrinho) : [];
    }

    // Salva carrinho no localStorage
    function salvarCarrinho(carrinho) {
      localStorage.setItem('semear_carrinho', JSON.stringify(carrinho));
    }

    function fmtPreco(v){
      return v.toLocaleString('pt-BR',{ style:'currency', currency:'BRL' });
    }

    // Renderiza os itens do carrinho
    function renderizarCarrinho() {
      const carrinho = obterCarrinho();
      const container = document.getElementById('itensCarrinho');
      const vazio = document.getElementById('carrinhoVazio');
      const conteudo = document.getElementById('carrinhoConteudo');

      if (carrinho.length === 0) {
        vazio.style.display = 'block';
        conteudo.style.display = 'none';
        return;
      }

      vazio.style.display = 'none';
      conteudo.style.display = 'block';

      container.innerHTML = carrinho.map((item, index) => {
        const p = item.produto;
        const subtotal = p.preco * item.quantidade;

        return `
          <div class="card">
            <div class="card-body" style="display: flex; gap: 20px; align-items: center;">
              ${p.imagem_url ? `<img src="${p.imagem_url}" alt="${p.nome_produto}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">` : ''}
              
              <div style="flex: 1;">
                <h3 style="margin: 0 0 8px 0;">${p.nome_produto}</h3>
                <p style="color: #666; margin: 4px 0;">${p.propriedade?.nome_propriedade || 'Produtor'}</p>
                <p style="font-weight: 600; color: #28a745; margin: 8px 0;">${fmtPreco(p.preco)} / ${p.unidade_medida}</p>
              </div>

              <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn" onclick="diminuirQuantidade(${index})" style="padding: 8px 12px;">−</button>
                <span style="font-weight: 600; font-size: 18px; min-width: 40px; text-align: center;">${item.quantidade}</span>
                <button class="btn" onclick="aumentarQuantidade(${index})" style="padding: 8px 12px;">+</button>
              </div>

              <div style="min-width: 120px; text-align: right;">
                <p style="font-weight: 700; font-size: 18px; margin: 0;">${fmtPreco(subtotal)}</p>
                <button class="btn" onclick="removerItem(${index})" style="margin-top: 8px; background: #dc3545; color: white;">Remover</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      calcularTotal();
    }

    // Calcula o total do carrinho
    function calcularTotal() {
      const carrinho = obterCarrinho();
      const total = carrinho.reduce((sum, item) => sum + (item.produto.preco * item.quantidade), 0);
      
      document.getElementById('subtotal').textContent = fmtPreco(total);
      document.getElementById('total').textContent = fmtPreco(total);
    }

    // Aumenta quantidade
    function aumentarQuantidade(index) {
      const carrinho = obterCarrinho();
      const item = carrinho[index];
      
      if (item.quantidade >= item.produto.estoque) {
        alert(`Estoque máximo: ${item.produto.estoque} ${item.produto.unidade_medida}`);
        return;
      }
      
      item.quantidade += 1;
      salvarCarrinho(carrinho);
      renderizarCarrinho();
    }

    // Diminui quantidade
    function diminuirQuantidade(index) {
      const carrinho = obterCarrinho();
      const item = carrinho[index];
      
      if (item.quantidade > 1) {
        item.quantidade -= 1;
        salvarCarrinho(carrinho);
        renderizarCarrinho();
      } else {
        removerItem(index);
      }
    }

    // Remove item
    function removerItem(index) {
      if (!confirm('Remover este produto do carrinho?')) return;
      
      const carrinho = obterCarrinho();
      carrinho.splice(index, 1);
      salvarCarrinho(carrinho);
      renderizarCarrinho();
    }

    // Finalizar pedido
    document.getElementById('btnFinalizar').addEventListener('click', async () => {
      const usuarioId = localStorage.getItem('usuario_id');
      
      if (!usuarioId) {
        alert('Você precisa estar logado!');
        window.location.href = 'login-restaurante.html';
        return;
      }

      const carrinho = obterCarrinho();
      if (carrinho.length === 0) {
        alert('Carrinho vazio!');
        return;
      }

      // Cria o pedido
      const pedidoData = {
        usuarioId: parseInt(usuarioId),
        status: 'PENDENTE',
        itens: carrinho.map(item => ({
          produtoId: item.produto.id_produto,
          quantidade: item.quantidade,
          preco_unitario: item.produto.preco
        }))
      };

      console.log('Enviando pedido:', pedidoData); // Debug

      try {
        const response = await fetch(`${API_BASE}/pedidos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(pedidoData)
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Erro do servidor:', errorText);
          throw new Error('Erro ao criar pedido: ' + errorText);
        }
        
        const pedido = await response.json();
        
        // Limpa carrinho
        localStorage.removeItem('semear_carrinho');
        
        alert('Pedido realizado com sucesso!');
        window.location.href = 'meus-pedidos.html';
      } catch (error) {
        console.error('Erro ao finalizar pedido:', error);
        alert('Erro ao finalizar pedido. Tente novamente.');
      }
    });

    // Renderiza ao carregar
    renderizarCarrinho();
  </script>
</body>
</html>
