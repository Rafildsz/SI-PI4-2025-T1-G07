<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo — Semear</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
  <!-- Header fino -->
  <header class="container dash-header" role="banner">
    <a class="brand-inline" href="index.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <div class="searchbar" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
              stroke="#777" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" placeholder="Buscar por produto, ingrediente ou produtor..." />
    </div>

    <!-- botão hambúrguer -->
    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="container layout" role="main">
    <section>
      <div class="greet">
        <h2>Olá <span id="nomeRest">[Nome do Restaurante]</span>! O que sua cozinha precisa hoje?</h2>
        <p>Explore os produtos disponíveis perto de você.</p>
      </div>

      <div class="toolbar">
        <button class="btn" id="btnFiltros">Filtros</button>
        <button class="btn" id="btnAdd">+</button>
        <div class="toolbar-right">
          <select id="ordem" class="select">
            <option>Ordenar por</option>
            <option value="preco_asc">Preço: menor para maior</option>
            <option value="preco_desc">Preço: maior para menor</option>
            <option value="distancia">Mais próximos</option>
            <option value="avaliacao">Melhor avaliados</option>
          </select>
        </div>
      </div>

      <div id="chips" class="chips"></div>

      <!-- Grid de produtos -->
      <div class="grid" id="gridProdutos"></div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-avatar">U</div>
        <div>
          <div class="sb-title">Usuário</div>
          <small>Restaurante</small>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item" href="meus-pedidos.html">🧾 Meus Pedidos</a>
        <a class="sb-item" href="mensagem.html">✉️ Mensagens</a>
        <div class="sb-sep"></div>
        <a class="sb-item sb-logout" href="index.html">↩️ Sair</a>
      </nav>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear</p>
    </div>
  </footer>

  <!-- JS do Catálogo -->
  <script>
    // Ano rodapé
    document.getElementById('year').textContent = new Date().getFullYear();

    // Saudação
    try {
      const cad = JSON.parse(localStorage.getItem('semear_cadastro_demo') || '{}');
      if (cad && cad.nome)
        document.getElementById('nomeRest').textContent = cad.nome.split(' ')[0];
    } catch (e) {}

    // MOCK de produtos (compatível com backend)
    const produtos = [
      { id_produto: 1, nome_produto:'Batata', preco:4.09, unidade_medida:'kg', imagem_url:'assets/batata_catalogo.svg', produtor:'Sítio Bela Vista', rating:4.8, distancia:8 },
      { id_produto: 2, nome_produto:'Tomate', preco:5.19, unidade_medida:'kg', imagem_url:'assets/tomate_catalogo.svg', produtor:'Sítio Bela Vista', rating:4.8, distancia:8 },
      { id_produto: 3, nome_produto:'Cenoura', preco:2.89, unidade_medida:'kg', imagem_url:'assets/cenoura_catalogo.svg', produtor:'Sítio Bela Vista', rating:4.8, distancia:8 },
      { id_produto: 4, nome_produto:'Alface', preco:1.10, unidade_medida:'kg', imagem_url:'assets/alface_catalogo.svg', produtor:'Sítio Bela Vista', rating:4.8, distancia:8 },
      { id_produto: 5, nome_produto:'Uva', preco:3.09, unidade_medida:'kg', imagem_url:'assets/uva_catalogo.svg', produtor:'Fazenda Feliz', rating:5.0, distancia:5 },
      { id_produto: 6, nome_produto:'Maçã', preco:8.75, unidade_medida:'kg', imagem_url:'assets/maca_catalogo.svg', produtor:'Fazenda Feliz', rating:5.0, distancia:5 },
      { id_produto: 7, nome_produto:'Chuchu', preco:5.90, unidade_medida:'kg', imagem_url:'assets/chuchu_catalogo.svg', produtor:'Sítio Vila Rica', rating:4.6, distancia:12 },
      { id_produto: 8, nome_produto:'Pimenta', preco:7.74, unidade_medida:'kg', imagem_url:'assets/pimenta_catalogo.svg', produtor:'Sítio Vila Rica', rating:4.6, distancia:12 }
    ];

    const grid = document.getElementById('gridProdutos');

    function fmtPreco(v){
      return v.toLocaleString('pt-BR',{ style:'currency', currency:'BRL' });
    }

    // Card do produto (corrigido)
    function card(p){
      return `
        <article class="card">
          <img src="${p.imagem_url}" alt="${p.nome_produto}">
          <div class="card-body">
            <h3>${p.nome_produto}</h3>
            <div class="meta">
              <div class="price">${fmtPreco(p.preco)} <small>/ ${p.unidade_medida}</small></div>
              <div>Por ${p.produtor} ★ ${p.rating}</div>
              <div>A ${p.distancia} km de você</div>
            </div>

            <!-- Botão Adicionar ao Carrinho -->
            <button class="btn-add-carrinho"
              onclick="adicionarCarrinho(${p.id_produto})"
              🛒 Adicionar ao Carrinho
            </button>

          </div>
        </article>
      `;
    }

    function render(lista){
      grid.innerHTML = lista.map(card).join('');
    }
    render(produtos);

    // Ordenação
    document.getElementById('ordem').addEventListener('change', (e) => {
      const v = e.target.value;
      const arr = [...produtos];
      if (v === 'preco_asc') arr.sort((a,b)=>a.preco-b.preco);
      if (v === 'preco_desc') arr.sort((a,b)=>b.preco-a.preco);
      if (v === 'distancia') arr.sort((a,b)=>a.distancia-b.distancia);
      if (v === 'avaliacao') arr.sort((a,b)=>b.rating-a.rating);
      render(arr);
    });

    // Chips
    const chips = document.getElementById('chips');
    document.getElementById('btnAdd').addEventListener('click', () => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.innerHTML = 'Orgânico <button class="chip-x">×</button>';
      c.querySelector('.chip-x').onclick = () => c.remove();
      chips.appendChild(c);
    });
  </script>

  <!-- Toggle sidebar -->
  <script>
    const hamb = document.getElementById('hamb');
    const KEY = 'semear_sidebar_hidden';
    if (localStorage.getItem(KEY) === '1'){
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded','false');
    }
    hamb.onclick = () => {
      const h = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', !h);
      localStorage.setItem(KEY, h ? '1':'0');
    };
  </script>

  <!-- JS do carrinho -->
  <script src="js/carrinho.js"></script>

</body>
</html>
