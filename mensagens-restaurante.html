<!-- 
  ========================================
  SEMEAR - Dashboard Mensagens Restaurante
  ========================================
  Descrição: Dashboard de mensagens para restaurantes gerenciarem conversas com produtores
  
  Funcionalidades:
  - Lista de conversas ativas
  - Chat integrado com histórico
  - Notificações de novas mensagens
  - Busca e filtro de conversas
  - Status de leitura de mensagens
  - Menu lateral com navegação
  
  Dependências:
  - css/catalogo.css
  - css/mensagens.css
  - js/mensagens-restaurante.js
  - js/menu-restaurante.js
  ========================================
-->

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mensagens — Semear</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/catalogo.css">
  <link rel="stylesheet" href="css/mensagens.css">

</head>

<body>

  <!-- HEADER -->
  <header class="container dash-header" role="banner">
    <a class="brand-inline" href="index.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="container layout" role="main">
    <section>
      <!-- ÁREA DE MENSAGENS -->
      <div class="messages-wrapper">

        <!-- LISTA -->
        <section class="conversation-list">
          <h2>Mensagens</h2>

          <input type="text" class="search-box" placeholder="Pesquisar">

          <ul id="listaConversas" class="conversation-items">
            <!-- carregado por JS -->
          </ul>
        </section>

        <!-- CHAT -->
        <section class="chat-area">

          <header class="chat-header">
            <div class="avatar"></div>
            <span id="chatNome" class="chat-title">Selecione uma conversa</span>
          </header>

          <div id="chatMensagens" class="chat-messages">
            <!-- mensagens por JS -->
          </div>

          <footer class="chat-input-box">
            <input id="msgInput" type="text" placeholder="Mensagem">
            <button id="btnEnviar" class="send-btn">➤</button>
          </footer>

        </section>

      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Conteúdo carregado dinamicamente -->
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear</p>
    </div>
  </footer>

  <!-- Toggle sidebar -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    
    const hamb = document.getElementById('hamb');
    const KEY = 'semear_sidebar_hidden';
    if (localStorage.getItem(KEY) === '1'){
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded','false');
    }
    hamb.onclick = () => {
      const h = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', !h);
      localStorage.setItem(KEY, h ? '1':'0');
    };
  </script>

  <script src="js/menu-restaurante.js"></script>
  <script src="js/mensagens-restaurante.js"></script>

</body>
</html>
