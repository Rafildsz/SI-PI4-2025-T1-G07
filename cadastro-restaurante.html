<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cadastro Restaurante — Semear</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <img src="assets/logo.svg">
      <span class="brand">Semear</span>
    </a>
  </div>
</header>

<main class="container">

  <!-- STEPPER -->
  <div class="stepper">
    <div class="step step1 active">
      <div class="circle">1</div>
      Crie sua conta
    </div>

    <div class="step-line line1"></div>

    <div class="step step2">
      <div class="circle">2</div>
      Restaurante
    </div>

    <div class="step-line line2"></div>

    <div class="step step3">
      <div class="circle">3</div>
      Detalhes
    </div>
  </div>

  <!-- FORM -->
  <form id="formRest">

    <!-- STEP 1 -->
    <div class="form-card" data-step="1">
      <h2>Vamos começar!</h2>
      <p class="lead">Crie sua conta</p>

      <div class="form-row">
        <div class="field"><input type="text" name="nome" placeholder="Nome completo" required></div>
      </div>

      <div class="form-row">
        <div class="field"><input type="email" name="email" placeholder="Seu melhor email" required></div>
      </div>

      <div class="form-row">
        <div class="field"><input type="password" name="senha" placeholder="Crie uma senha" required></div>
      </div>

      <div class="form-row">
        <div class="field"><input type="password" name="senha2" placeholder="Confirme a senha" required></div>
      </div>

      <div class="actions">
        <span></span>
        <button type="button" class="btn-green" onclick="go(2)">Continuar</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="form-card" data-step="2" style="display:none;">
      <h2>Informações do Restaurante</h2>

      <div class="form-row">
        <div class="field"><input type="text" name="nomeRest" placeholder="Nome do restaurante" required></div>
      </div>

      <div class="form-row">
        <div class="field"><input type="text" name="cidade" placeholder="Cidade / Região" required></div>
      </div>

      <div class="actions">
        <button type="button" class="btn-back" onclick="go(1)">Voltar</button>
        <button type="button" class="btn-green" onclick="go(3)">Continuar</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="form-card" data-step="3" style="display:none;">
      <h2>Bem-vindo ao Semear</h2>
      <p class="lead">Estamos quase lá! Complete suas preferências.</p>

      <p>Tipo de cozinha:</p>

      <div class="form-row" style="flex-wrap:wrap;">
        <label><input type="checkbox" name="coz" value="Italiana"> Italiana</label>
        <label><input type="checkbox" name="coz" value="Brasileira"> Brasileira</label>
        <label><input type="checkbox" name="coz" value="Japonesa"> Japonesa</label>
        <label><input type="checkbox" name="coz" value="Natural"> Natural</label>
        <label><input type="checkbox" name="coz" value="Hamburgueria"> Hamburgueria</label>
      </div>

      <p style="margin-top:16px;">Principais ingredientes:</p>
      <input type="text" id="ingrediente" placeholder="Digite e aperte Enter">

      <div id="chips" style="margin:12px 0; display:flex; gap:8px; flex-wrap:wrap;"></div>

      <textarea name="descricao" placeholder="Descrição do estabelecimento"></textarea>

      <div class="actions">
        <button type="button" class="btn-back" onclick="go(2)">Voltar</button>
        <button type="submit" class="btn-green">Finalizar Cadastro</button>
      </div>

    </div>

  </form>
</main>

<script>
function go(n){
  document.querySelectorAll("[data-step]").forEach(s => s.style.display="none");
  document.querySelector(`[data-step="${n}"]`).style.display="block";

  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active","completed"));
  document.querySelector(`.step${n}`).classList.add("active");

  if(n>=2){ document.querySelector(".step1").classList.add("completed"); document.querySelector(".line1").classList.add("completed"); }
  if(n>=3){ document.querySelector(".step2").classList.add("completed"); document.querySelector(".line2").classList.add("completed"); }
}

/* chips */
document.getElementById("ingrediente").addEventListener("keypress", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    const t=e.target.value.trim();
    if(!t) return;
    const c=document.createElement("span");
    c.className="chip";
    c.innerHTML=t+" <button onclick='this.parentElement.remove()'>x</button>";
    document.getElementById("chips").appendChild(c);
    e.target.value="";
  }
});

/* final submit */
document.getElementById("formRest").addEventListener("submit", e=>{
  e.preventDefault();
  let nome = document.querySelector("input[name='nomeRest']").value;
  localStorage.setItem("nomeRestaurante", nome);
  window.location.href="bem-vindo-restaurante.html";
});
</script>

</body>
</html>
