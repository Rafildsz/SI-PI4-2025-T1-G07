<!-- 
  ========================================
  SEMEAR - Meus Pedidos
  ========================================
  Descrição: Página que lista todos os pedidos do restaurante na plataforma SEMEAR
  
  Funcionalidades:
  - Listagem completa de pedidos realizados
  - Filtro por status (pendente, confirmado, entregue, cancelado)
  - Busca de pedidos por data/ID
  - Detalhes completos de cada pedido (itens, valores, produtor)
  - Acompanhamento do status em tempo real
  - Opção de reordenar produtos
  
  Dependências:
  - css/catalogo.css
  ========================================
-->

<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meus Pedidos — Semear</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal (reaproveitando do catálogo) -->
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

  <!-- Header -->
  <header class="container dash-header">
    <a class="brand-inline" href="catalogo.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <div class="searchbar" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
              stroke="#777" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" placeholder="Buscar pedido..." />
    </div>

    <!-- botão hambúrguer -->
    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- MAIN -->
  <main class="container layout" style="min-height: calc(100vh - 140px);">

    <!-- Conteúdo principal -->
    <section style="margin-bottom:60px;">

      <div class="greet">
        <h2>Meus Pedidos</h2>
        <p>Acompanhe o status dos seus pedidos.</p>
      </div>

      <!-- Tabs de Filtro -->
      <div style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0;">
        <button class="tab-btn active" data-status="todos" onclick="filtrarPorStatus('todos')">
          Todos
        </button>
        <button class="tab-btn" data-status="pendentes" onclick="filtrarPorStatus('pendentes')">
          Pendentes
        </button>
        <button class="tab-btn" data-status="andamento" onclick="filtrarPorStatus('andamento')">
          Em Andamento
        </button>
        <button class="tab-btn" data-status="enviados" onclick="filtrarPorStatus('enviados')">
          Enviados
        </button>
        <button class="tab-btn" data-status="finalizados" onclick="filtrarPorStatus('finalizados')">
          Finalizados
        </button>
        <button class="tab-btn" data-status="cancelados" onclick="filtrarPorStatus('cancelados')">
          Cancelados
        </button>
      </div>

      <!-- aqui vai o carrinho -->
      <div id="estadoCarrinho" style="margin-bottom: 16px; font-size: 0.95rem; color: #555;"></div>

      <div class="grid" id="listaPedidos"></div>

    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Conteúdo carregado por menu-restaurante.js -->
    </aside>

  </main>

  <!-- Modal de Detalhes do Pedido -->
  <div id="modalDetalhes" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 32px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0;">Detalhes do Pedido</h2>
        <button onclick="fecharModalDetalhes()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0; width: 32px; height: 32px;">&times;</button>
      </div>
      <div id="detalhesContent"></div>
      <button onclick="fecharModalDetalhes()" class="btn btn-primary" style="width: 100%; margin-top: 24px; padding: 12px;">Fechar</button>
    </div>
  </div>

  <!-- Espaço para empurrar o rodapé exatamente como no catálogo -->
  <div style="height:120px;"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear — Produtos frescos direto do produtor.</p>
    </div>
  </footer>

  <!-- JS -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const API_BASE = "http://localhost:8081/api";
    const lista = document.getElementById("listaPedidos");
    const estadoCarrinho = document.getElementById("estadoCarrinho");

    let todosPedidosCache = [];
    let statusAtual = 'todos';

    function fmtMoeda(v){
      if (v == null) return "R$ 0,00";
      return v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    }

    function fmtData(dataStr) {
      if (!dataStr) return '';
      const data = new Date(dataStr);
      return data.toLocaleDateString('pt-BR', { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Carrega pedidos do restaurante
    async function carregarPedidos() {
      const usuarioId = localStorage.getItem('usuario_id');
      
      if (!usuarioId) {
        window.location.href = 'login-restaurante.html';
        return;
      }      try {
        const response = await fetch(`${API_BASE}/pedidos`);
        if (!response.ok) throw new Error('Erro ao buscar pedidos');
        
        const todosPedidos = await response.json();
        
        // Filtra pedidos do restaurante logado
        todosPedidosCache = todosPedidos.filter(p => {
          return p.restaurante?.id_usuario == usuarioId;
        });
        
        aplicarFiltro();
      } catch (error) {
        console.error('Erro ao carregar pedidos:', error);
        estadoCarrinho.textContent = "Erro ao carregar pedidos.";
        lista.innerHTML = '<p style="text-align: center; padding: 40px;">Erro ao carregar pedidos.</p>';
      }
    }

    function filtrarPorStatus(status) {
      statusAtual = status;
      
      // Atualiza botões ativos
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-status="${status}"]`).classList.add('active');
      
      aplicarFiltro();
    }

    function aplicarFiltro() {
      let pedidosFiltrados = [...todosPedidosCache];
      
      // Filtra por status
      if (statusAtual === 'pendentes') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'PENDENTE');
      } else if (statusAtual === 'andamento') {
        pedidosFiltrados = pedidosFiltrados.filter(p => 
          p.status === 'CONFIRMADO' || p.status === 'EM_PREPARO'
        );
      } else if (statusAtual === 'enviados') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'ENVIADO');
      } else if (statusAtual === 'finalizados') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'ENTREGUE');
      } else if (statusAtual === 'cancelados') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.status === 'CANCELADO');
      }
      
      renderizarPedidos(pedidosFiltrados);
    }

    function renderizarPedidos(pedidos) {
      if (pedidos.length === 0) {
        estadoCarrinho.textContent = statusAtual === 'todos' ? "Você ainda não fez nenhum pedido." : `Nenhum pedido ${statusAtual === 'pendentes' ? 'pendente' : statusAtual === 'finalizados' ? 'finalizado' : 'nesta categoria'}.`;
        lista.innerHTML = `
          <div style="text-align: center; padding: 60px 20px;">
            <h3>Nenhum pedido ${statusAtual === 'todos' ? 'realizado' : 'encontrado'}</h3>
            <p style="color: #666; margin: 16px 0;">${statusAtual === 'todos' ? 'Visite o catálogo e faça seu primeiro pedido!' : 'Não há pedidos nesta categoria.'}</p>
            <a href="catalogo.html" class="btn btn-primary" style="text-decoration: none; display: inline-block; margin-top: 16px;">
              Ir para o Catálogo
            </a>
          </div>
        `;
        return;
      }

      estadoCarrinho.textContent = `Você tem ${pedidos.length} pedido(s) realizado(s).`;

      lista.innerHTML = pedidos.map(pedido => {
        const statusColors = {
          'PENDENTE': '#ffc107',
          'CONFIRMADO': '#17a2b8',
          'EM_PREPARO': '#17a2b8',
          'ENVIADO': '#17a2b8',
          'ENTREGUE': '#28a745',
          'CANCELADO': '#dc3545'
        };

        return `
          <article class="card">
            <div class="card-body">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px;">
                <div>
                  <h3>Pedido #${pedido.id_pedido}</h3>
                  <p class="meta">${fmtData(pedido.data_pedido)}</p>
                </div>
                <span class="chip" style="background: ${statusColors[pedido.status] || '#6c757d'}; color: white; padding: 4px 12px; border-radius: 12px;">
                  ${pedido.status}
                </span>
              </div>

              <div style="margin: 12px 0;">
                <strong>Produtor:</strong> ${pedido.produtor?.nome || 'N/A'}
              </div>

              <div style="margin: 12px 0;">
                <strong>Total:</strong> <span style="font-size: 18px; color: #28a745; font-weight: 700;">${fmtMoeda(pedido.valor_total)}</span>
              </div>

              ${pedido.observacoes ? `<p style="color: #666; margin: 8px 0;"><strong>Observações:</strong> ${pedido.observacoes}</p>` : ''}

              <div class="toolbar-right" style="margin-top: 16px;">
                <button class="btn btn-primary" onclick="verDetalhes(${pedido.id_pedido})">Ver Detalhes</button>
                ${pedido.status === 'PENDENTE' ? `<button class="btn" style="background: #dc3545; color: white;" onclick="cancelarPedido(${pedido.id_pedido})">Cancelar</button>` : ''}
                ${pedido.status === 'ENVIADO' ? `<button class="btn" style="background: #28a745; color: white;" onclick="marcarEntregue(${pedido.id_pedido})">Marcar como Entregue</button>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function verDetalhes(pedidoId) {
      // Busca o pedido completo com itens
      fetch(`${API_BASE}/pedidos/${pedidoId}`)
        .then(res => res.json())
        .then(pedido => {
          mostrarModalDetalhes(pedido);
        })
        .catch(err => {
          console.error('Erro ao buscar detalhes:', err);
          alert('Erro ao carregar detalhes do pedido');
        });
    }

    function mostrarModalDetalhes(pedido) {
      const modal = document.getElementById('modalDetalhes');
      const content = document.getElementById('detalhesContent');
      
      const itensHtml = pedido.itens.map(item => `
        <div style="display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee;">
          <div style="flex: 1;">
            <strong>${item.produto?.nome_produto || 'Produto'}</strong>
            <p style="color: #666; margin: 4px 0; font-size: 14px;">
              ${item.quantidade} ${item.produto?.unidade_medida || 'un'} × ${fmtMoeda(item.preco_unitario)}
            </p>
          </div>
          <div style="font-weight: 700; font-size: 16px;">
            ${fmtMoeda(item.quantidade * item.preco_unitario)}
          </div>
        </div>
      `).join('');

      content.innerHTML = `
        <div style="margin-bottom: 24px;">
          <h3 style="margin: 0 0 8px 0;">Pedido #${pedido.id_pedido}</h3>
          <p style="color: #666; margin: 0;">${fmtData(pedido.data_pedido)}</p>
        </div>

        <div style="background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
          <div style="display: grid; gap: 12px;">
            <div>
              <strong>Status:</strong> 
              <span style="color: ${pedido.status === 'ENTREGUE' ? '#28a745' : '#ffc107'};">${pedido.status}</span>
            </div>
            <div>
              <strong>Produtor:</strong> ${pedido.produtor?.nome || 'N/A'}
            </div>
            ${pedido.observacoes ? `<div><strong>Observações:</strong> ${pedido.observacoes}</div>` : ''}
          </div>
        </div>

        <h4 style="margin: 0 0 12px 0;">Itens do Pedido</h4>
        <div style="border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 24px;">
          ${itensHtml}
        </div>

        <div style="background: #f8f9fa; padding: 16px; border-radius: 8px;">
          <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700;">
            <span>Total:</span>
            <span style="color: #28a745;">${fmtMoeda(pedido.valor_total)}</span>
          </div>
        </div>
      `;

      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function fecharModalDetalhes() {
      document.getElementById('modalDetalhes').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    // Fecha modal ao clicar fora
    document.getElementById('modalDetalhes')?.addEventListener('click', function(e) {
      if (e.target === this) {
        fecharModalDetalhes();
      }
    });

    async function cancelarPedido(pedidoId) {
      if (!confirm('Tem certeza que deseja cancelar este pedido?')) return;

      try {
        const response = await fetch(`${API_BASE}/pedidos/${pedidoId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: 'CANCELADO' })
        });

        if (response.ok) {
          alert('Pedido cancelado com sucesso!');
          carregarPedidos();
        } else {
          alert('Erro ao cancelar pedido');
        }
      } catch (error) {
        console.error('Erro ao cancelar pedido:', error);
        alert('Erro ao cancelar pedido');
      }
    }

    async function marcarEntregue(pedidoId) {
      if (!confirm('Confirmar que o pedido foi entregue?')) return;

      try {
        const response = await fetch(`${API_BASE}/pedidos/${pedidoId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: 'ENTREGUE' })
        });

        if (response.ok) {
          alert('Pedido marcado como entregue!');
          carregarPedidos();
        } else {
          alert('Erro ao atualizar pedido');
        }
      } catch (error) {
        console.error('Erro ao atualizar pedido:', error);
        alert('Erro ao atualizar pedido');
      }
    }

    // Sidebar toggle
    const hamb = document.getElementById('hamb');
    const SIDEBAR_KEY = 'semear_sidebar_hidden';

    if (localStorage.getItem(SIDEBAR_KEY) === '1') {
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded', 'false');
    }

    hamb.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', hidden ? 'false' : 'true');
      localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : '0');
    });

    // Carregar pedidos ao abrir página
    carregarPedidos();
  </script>

  <!-- JS do Menu -->
  <script src="js/menu-restaurante.js"></script>

</body>
</html>
