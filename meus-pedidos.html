<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meus Pedidos — Semear</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal (reaproveitando do catálogo) -->
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

  <!-- Header -->
  <header class="container dash-header">
    <a class="brand-inline" href="catalogo.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <div class="searchbar" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
              stroke="#777" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" placeholder="Buscar pedido..." />
    </div>

    <!-- botão hambúrguer -->
    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- MAIN -->
  <main class="container layout" style="min-height: calc(100vh - 140px);">

    <!-- Conteúdo principal -->
    <section style="margin-bottom:60px;">

      <div class="greet">
        <h2>Meus Pedidos</h2>
        <p>Acompanhe o status dos seus pedidos.</p>
      </div>

      <!-- aqui vai o carrinho -->
      <div id="estadoCarrinho" style="margin-bottom: 16px; font-size: 0.95rem; color: #555;"></div>

      <div class="grid" id="listaPedidos"></div>

    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-avatar">U</div>
        <div>
          <div class="sb-title">Usuário</div>
          <small>Restaurante</small>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item" href="catalogo.html">🌽 Catálogo</a>
        <a class="sb-item" href="meus-pedidos.html">🧾 Meus Pedidos</a>
        <a class="sb-item" href="mensagem.html">✉️ Mensagens</a>
        <div class="sb-sep"></div>
        <a class="sb-item sb-logout" href="index.html">↩️ Sair</a>
      </nav>
    </aside>

  </main>

  <!-- Espaço para empurrar o rodapé exatamente como no catálogo -->
  <div style="height:120px;"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear — Produtos frescos direto do produtor.</p>
    </div>
  </footer>

  <!-- JS -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const API_BASE = "http://localhost:8080/api";
    const lista = document.getElementById("listaPedidos");
    const estadoCarrinho = document.getElementById("estadoCarrinho");

    function fmtMoeda(v){
      if (v == null) return "R$ 0,00";
      return v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    }

    function fmtData(dataStr) {
      if (!dataStr) return '';
      const data = new Date(dataStr);
      return data.toLocaleDateString('pt-BR', { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Carrega pedidos do restaurante
    async function carregarPedidos() {
      const usuarioId = localStorage.getItem('usuario_id');
      
      if (!usuarioId) {
        window.location.href = 'login-restaurante.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/pedidos`);
        if (!response.ok) throw new Error('Erro ao buscar pedidos');
        
        const todosPedidos = await response.json();
        console.log('Todos os pedidos:', todosPedidos); // Debug
        
        // Filtra pedidos do restaurante logado
        const pedidos = todosPedidos.filter(p => {
          console.log('Pedido:', p.id_pedido, 'Restaurante:', p.restaurante); // Debug
          return p.restaurante?.id_usuario == usuarioId;
        });
        
        console.log('Pedidos filtrados:', pedidos); // Debug
        renderizarPedidos(pedidos);
      } catch (error) {
        console.error('Erro ao carregar pedidos:', error);
        estadoCarrinho.textContent = "Erro ao carregar pedidos.";
        lista.innerHTML = '<p style="text-align: center; padding: 40px;">Erro ao carregar pedidos.</p>';
      }
    }

    function renderizarPedidos(pedidos) {
      if (pedidos.length === 0) {
        estadoCarrinho.textContent = "Você ainda não fez nenhum pedido.";
        lista.innerHTML = `
          <div style="text-align: center; padding: 60px 20px;">
            <h3>Nenhum pedido realizado</h3>
            <p style="color: #666; margin: 16px 0;">Visite o catálogo e faça seu primeiro pedido!</p>
            <a href="catalogo.html" class="btn btn-primary" style="text-decoration: none; display: inline-block; margin-top: 16px;">
              Ir para o Catálogo
            </a>
          </div>
        `;
        return;
      }

      estadoCarrinho.textContent = `Você tem ${pedidos.length} pedido(s) realizado(s).`;

      lista.innerHTML = pedidos.map(pedido => {
        const statusClass = {
          'PENDENTE': 'warning',
          'CONFIRMADO': 'info',
          'EM_PREPARO': 'info',
          'ENVIADO': 'primary',
          'ENTREGUE': 'success',
          'CANCELADO': 'danger'
        }[pedido.status] || 'secondary';

        return `
          <article class="card">
            <div class="card-body">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px;">
                <div>
                  <h3>Pedido #${pedido.id_pedido}</h3>
                  <p class="meta">${fmtData(pedido.data_pedido)}</p>
                </div>
                <span class="chip" style="background: var(--${statusClass}, #6c757d); color: white; padding: 4px 12px; border-radius: 12px;">
                  ${pedido.status}
                </span>
              </div>

              <div style="margin: 12px 0;">
                <strong>Produtor:</strong> ${pedido.produtor?.nome || 'N/A'}
              </div>

              <div style="margin: 12px 0;">
                <strong>Total:</strong> <span style="font-size: 18px; color: #28a745; font-weight: 700;">${fmtMoeda(pedido.valor_total)}</span>
              </div>

              ${pedido.observacoes ? `<p style="color: #666; margin: 8px 0;"><strong>Observações:</strong> ${pedido.observacoes}</p>` : ''}

              <div class="toolbar-right" style="margin-top: 16px;">
                <button class="btn btn-primary" onclick="verDetalhes(${pedido.id_pedido})">Ver Detalhes</button>
                ${pedido.status === 'PENDENTE' ? `<button class="btn" style="background: #dc3545; color: white;" onclick="cancelarPedido(${pedido.id_pedido})">Cancelar</button>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function verDetalhes(pedidoId) {
      // TODO: Implementar modal ou página de detalhes
      alert(`Detalhes do pedido #${pedidoId} em desenvolvimento`);
    }

    async function cancelarPedido(pedidoId) {
      if (!confirm('Tem certeza que deseja cancelar este pedido?')) return;

      try {
        const response = await fetch(`${API_BASE}/pedidos/${pedidoId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: 'CANCELADO' })
        });

        if (response.ok) {
          alert('Pedido cancelado com sucesso!');
          carregarPedidos();
        } else {
          alert('Erro ao cancelar pedido');
        }
      } catch (error) {
        console.error('Erro ao cancelar pedido:', error);
        alert('Erro ao cancelar pedido');
      }
    }

    // Sidebar toggle
    const hamb = document.getElementById('hamb');
    const SIDEBAR_KEY = 'semear_sidebar_hidden';

    if (localStorage.getItem(SIDEBAR_KEY) === '1') {
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded', 'false');
    }

    hamb.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', hidden ? 'false' : 'true');
      localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : '0');
    });

    // Logout - limpar localStorage
    document.querySelector('.sb-logout').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('usuario_id');
      localStorage.removeItem('usuario_logado');
      localStorage.removeItem('semear_carrinho');
      window.location.href = 'index.html';
    });

    // Carregar pedidos ao abrir página
    carregarPedidos();
  </script>

</body>
</html>
