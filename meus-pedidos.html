<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meus Pedidos — Semear</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

  <!-- Header -->
  <header class="container dash-header">
    <a class="brand-inline" href="catalogo.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <div class="searchbar" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
              stroke="#777" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" placeholder="Buscar pedido..." />
    </div>

    <!-- botão hambúrguer -->
    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- MAIN -->
  <main class="container layout" style="min-height: calc(100vh - 140px);">

    <!-- Conteúdo principal -->
    <section style="margin-bottom:60px;">

      <div class="greet">
        <h2>Meus Pedidos</h2>
        <p>Acompanhe todos os pedidos realizados.</p>
      </div>

      <!-- Grid dos pedidos -->
      <div class="grid" id="listaPedidos"></div>

    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-avatar">U</div>
        <div>
          <div class="sb-title">Usuário</div>
          <small>Restaurante</small>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item" href="catalogo.html">🌽 Catálogo</a>
        <a class="sb-item" href="meus-pedidos.html">🧾 Meus Pedidos</a>
        <a class="sb-item" href="mensagem.html">✉️ Mensagens</a>
        <div class="sb-sep"></div>
        <a class="sb-item sb-logout" href="index.html">↩️ Sair</a>
      </nav>
    </aside>

  </main>

    </main>

  <!-- Espaço para empurrar o rodapé exatamente como no catálogo -->
  <div style="height:120px;"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear — Produtos frescos direto do produtor.</p>
    </div>
  </footer>


  <!-- JS -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const pedidos = [
      { id: 1023, status: "Concluído", data: "02/11/2025", total: 89.40 },
      { id: 1024, status: "A Caminho", data: "04/11/2025", total: 47.90 },
      { id: 1025, status: "Preparando", data: "05/11/2025", total: 62.10 },
      { id: 1026, status: "Cancelado", data: "05/11/2025", total: 33.20 }
    ];

    const lista = document.getElementById("listaPedidos");

    function fmt(v){
      return v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    }

    function cardPedido(p){
      return `
        <article class="card">
          <div class="card-body">
            <h3>Pedido #${p.id}</h3>
            <div class="meta">
              <div><strong>Status:</strong> ${p.status}</div>
              <div><strong>Data:</strong> ${p.data}</div>
              <div><strong>Total:</strong> ${fmt(p.total)}</div>
            </div>
            <button class="btn btn-primary" style="margin-top:10px; width:100%; cursor:pointer;">
              Ver detalhes
            </button>
          </div>
        </article>
      `;
    }

    lista.innerHTML = pedidos.map(cardPedido).join("");

    // Sidebar toggle
    const hamb = document.getElementById('hamb');
    const SIDEBAR_KEY = 'semear_sidebar_hidden';

    if (localStorage.getItem(SIDEBAR_KEY) === '1') {
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded', 'false');
    }

    hamb.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', hidden ? 'false' : 'true');
      localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : '0');
    });
  </script>

</body>
</html>
