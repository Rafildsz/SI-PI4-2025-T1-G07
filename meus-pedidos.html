<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/logo.png" type="image/svg+xml">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meus Pedidos — Semear</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS principal (reaproveitando do catálogo) -->
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

  <!-- Header -->
  <header class="container dash-header">
    <a class="brand-inline" href="catalogo.html">
      <img src="assets/logo.svg" alt="Semear">
      <span class="brand">Semear</span>
    </a>

    <div class="searchbar" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
              stroke="#777" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" placeholder="Buscar pedido..." />
    </div>

    <!-- botão hambúrguer -->
    <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- MAIN -->
  <main class="container layout" style="min-height: calc(100vh - 140px);">

    <!-- Conteúdo principal -->
    <section style="margin-bottom:60px;">

      <div class="greet">
        <h2>Meu Carrinho / Meus Pedidos</h2>
        <p>Veja os itens que estão sendo pedidos neste momento.</p>
      </div>

      <!-- aqui vai o carrinho -->
      <div id="estadoCarrinho" style="margin-bottom: 16px; font-size: 0.95rem; color: #555;"></div>

      <div class="grid" id="listaPedidos"></div>

    </section>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-avatar">U</div>
        <div>
          <div class="sb-title">Usuário</div>
          <small>Restaurante</small>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item" href="catalogo.html">🌽 Catálogo</a>
        <a class="sb-item" href="meus-pedidos.html">🧾 Meus Pedidos</a>
        <a class="sb-item" href="mensagem.html">✉️ Mensagens</a>
        <div class="sb-sep"></div>
        <a class="sb-item sb-logout" href="index.html">↩️ Sair</a>
      </nav>
    </aside>

  </main>

  <!-- Espaço para empurrar o rodapé exatamente como no catálogo -->
  <div style="height:120px;"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Semear — Produtos frescos direto do produtor.</p>
    </div>
  </footer>

  <!-- JS -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const API_CARRINHO = "http://localhost:8081/carrinho";

    const lista = document.getElementById("listaPedidos");
    const estadoCarrinho = document.getElementById("estadoCarrinho");

    function fmtMoeda(v){
      if (v == null) return "R$ 0,00";
      return v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    }

    // Renderiza o carrinho na tela
    function renderCarrinho(pedido) {
      if (!pedido || !pedido.itens || pedido.itens.length === 0) {
        lista.innerHTML = "";
        estadoCarrinho.textContent = "Seu carrinho está vazio.";
        return;
      }

      estadoCarrinho.textContent = `Status do pedido: ${pedido.status || "EM_ANDAMENTO"}`;

      const linhas = pedido.itens.map(item => {
        const subtotal = (item.preco_unitario || 0) * (item.quantidade || 0);
        const nome = item.produto?.nome_produto || "Produto";
        const unidade = item.produto?.unidade_medida || "";
        const img = item.produto?.imagem_url || "assets/placeholder.jpg";

        return `
          <tr>
            <td style="display:flex; align-items:center; gap:8px;">
              <img src="${img}" alt="${nome}" style="width:40px; height:40px; object-fit:cover; border-radius:8px;">
              <div>
                <div><strong>${nome}</strong></div>
                <small>${unidade}</small>
              </div>
            </td>
            <td>${fmtMoeda(item.preco_unitario || 0)}</td>
            <td>
              <input type="number"
                     min="1"
                     value="${item.quantidade}"
                     data-item-id="${item.id_item}"
                     class="input-quantidade"
                     style="width:70px; padding:4px;">
            </td>
            <td>${fmtMoeda(subtotal)}</td>
            <td>
              <button class="btn btn-danger btn-remover"
                      data-item-id="${item.id_item}"
                      style="padding:4px 8px; font-size:0.85rem; cursor:pointer;">
                Remover
              </button>
            </td>
          </tr>
        `;
      }).join("");

      const total = pedido.valor_total || pedido.itens
        .map(i => (i.preco_unitario || 0) * (i.quantidade || 0))
        .reduce((acc, v) => acc + v, 0);

      lista.innerHTML = `
        <article class="card">
          <div class="card-body">
            <h3>Itens do carrinho</h3>
            <div class="meta" style="margin-bottom:12px;">
              <div><strong>ID do Pedido:</strong> ${pedido.id_pedido}</div>
            </div>

            <div style="overflow-x:auto;">
              <table style="width:100%; border-collapse:collapse; font-size:0.95rem;">
                <thead>
                  <tr>
                    <th style="text-align:left; padding:8px 4px;">Produto</th>
                    <th style="text-align:left; padding:8px 4px;">Preço unitário</th>
                    <th style="text-align:left; padding:8px 4px;">Quantidade</th>
                    <th style="text-align:left; padding:8px 4px;">Subtotal</th>
                    <th style="text-align:left; padding:8px 4px;">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  ${linhas}
                </tbody>
              </table>
            </div>

            <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div><strong>Total:</strong> ${fmtMoeda(total)}</div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="btnFinalizar" class="btn btn-primary" style="cursor:pointer;">
                  Finalizar Pedido
                </button>
                <button id="btnLimpar" class="btn" style="cursor:pointer; background:#eee;">
                  Limpar Carrinho
                </button>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    // Carrega o carrinho do backend
    async function carregarCarrinho() {
      try {
        const res = await fetch(API_CARRINHO);
        if (!res.ok) {
          estadoCarrinho.textContent = "Não foi possível carregar o carrinho.";
          lista.innerHTML = "";
          return;
        }
        const data = await res.json();
        if (!data) {
          renderCarrinho(null);
        } else {
          renderCarrinho(data);
        }
      } catch (e) {
        console.error(e);
        estadoCarrinho.textContent = "Erro ao comunicar com o servidor.";
      }
    }

    // Remover item
    async function removerItem(itemId) {
      try {
        await fetch(`${API_CARRINHO}/remover/${itemId}`, {
          method: "DELETE"
        });
        await carregarCarrinho();
      } catch (e) {
        console.error(e);
        alert("Erro ao remover item.");
      }
    }

    // Atualizar quantidade
    async function atualizarQuantidade(itemId, quantidade) {
      if (quantidade <= 0) quantidade = 1;
      try {
        await fetch(`${API_CARRINHO}/quantidade?itemId=${itemId}&quantidade=${quantidade}`, {
          method: "PUT"
        });
        await carregarCarrinho();
      } catch (e) {
        console.error(e);
        alert("Erro ao atualizar quantidade.");
      }
    }

    // Finalizar pedido
    async function finalizarPedido() {
      try {
        const res = await fetch(`${API_CARRINHO}/finalizar`, {
          method: "POST"
        });
        if (!res.ok) {
          alert("Erro ao finalizar pedido.");
          return;
        }
        const pedido = await res.json();
        alert("Pedido finalizado com sucesso! ID: " + pedido.id_pedido);
        await carregarCarrinho();
      } catch (e) {
        console.error(e);
        alert("Erro ao finalizar pedido.");
      }
    }

    // Limpar carrinho
    async function limparCarrinho() {
      try {
        await fetch(`${API_CARRINHO}/limpar`, {
          method: "POST"
        });
        await carregarCarrinho();
      } catch (e) {
        console.error(e);
        alert("Erro ao limpar carrinho.");
      }
    }

    // Delegação de eventos para itens do carrinho
    lista.addEventListener("click", (e) => {
      if (e.target.classList.contains("btn-remover")) {
        const id = e.target.dataset.itemId;
        removerItem(id);
      }
    });

    lista.addEventListener("change", (e) => {
      if (e.target.classList.contains("input-quantidade")) {
        const id = e.target.dataset.itemId;
        const qtd = parseInt(e.target.value, 10) || 1;
        atualizarQuantidade(id, qtd);
      }
    });

    // Botões Finalizar e Limpar (usando event delegation simples)
    document.addEventListener("click", (e) => {
      if (e.target.id === "btnFinalizar") {
        finalizarPedido();
      }
      if (e.target.id === "btnLimpar") {
        limparCarrinho();
      }
    });

    // Sidebar toggle
    const hamb = document.getElementById('hamb');
    const SIDEBAR_KEY = 'semear_sidebar_hidden';

    if (localStorage.getItem(SIDEBAR_KEY) === '1') {
      document.body.classList.add('no-sidebar');
      hamb.setAttribute('aria-expanded', 'false');
    }

    hamb.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('no-sidebar');
      hamb.setAttribute('aria-expanded', hidden ? 'false' : 'true');
      localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : '0');
    });

    // Carregar carrinho ao abrir página
    carregarCarrinho();
  </script>

</body>
</html>
